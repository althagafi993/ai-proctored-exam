<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم/ة | EduServices 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets-css-style.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-4 md:p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-lg">
        <div class="flex justify-between items-center mb-6 border-b pb-3">
            <div>
                <h2 class="text-2xl font-bold text-indigo-800">لوحة تحكم المعلم/ة - إعداد الاختبار</h2>
                <p class="text-xs text-gray-500">EduServices 2026 © جميع الحقوق محفوظة</p>
            </div>
            <a href="index.html" class="text-indigo-600 hover:underline text-sm font-semibold">← الرئيسية</a>
        </div>

        <form id="exam-setup-form" class="space-y-6">
            <!-- عنوان الاختبار -->
            <div>
                <label class="block font-semibold mb-2">عنوان الاختبار:</label>
                <input type="text" id="exam-title" class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" value="إختبار عن بعد مراقب بالذكاء الإصطناعي" required>
            </div>

            <!-- طريقة إدخال الأسئلة -->
            <div>
                <label class="block font-semibold mb-2">طريقة إضافة الأسئلة للاختبار:</label>
                <select id="input-mode" onchange="toggleInputMode()" class="w-full border p-3 rounded-lg bg-gray-50 font-medium">
                    <option value="pdf">الوضع السريع: رفع ملف الأسئلة (PDF / صورة) وتحديد الإجابات فقط</option>
                    <option value="manual">الوضع التفاعلي: إدخال الأسئلة والخيارات والدرجات يدوياً</option>
                </select>
            </div>

            <!-- خيار رفع الملف (الوضع السريع) -->
            <div id="pdf-mode-container" class="space-y-4 border p-4 rounded-lg bg-indigo-50/50">
                <div>
                    <label class="block font-semibold mb-2 text-indigo-900">1. رفع ملف الأسئلة (PDF أو صورة):</label>
                    <input type="file" id="exam-file" class="w-full border p-2 rounded-lg bg-white" accept=".pdf,image/*">
                    <p class="text-xs text-gray-500 mt-1">* سيظهر هذا الملف للطلاب أثناء الاختبار للمعاينة فقط ودون إمكانية التنزيل.</p>
                </div>

                <div>
                    <label class="block font-semibold mb-2 text-indigo-900">2. مفتاح الإجابات النموذجية للتصحيح التلقائي:</label>
                    <p class="text-xs text-gray-600 mb-2">قم بكتابة رقم السؤال والإجابة الصحيحة والدرجة بشكل مبسط (مثال: <code class="bg-gray-200 px-1 rounded">1:أ:2</code> تعني السؤال الأول إجابته أ ودرجته 2):</p>
                    <textarea id="answer-key" rows="4" class="w-full border p-3 rounded-lg bg-white font-mono dir-ltr text-left" placeholder="1:أ:1&#10;2:صح:1&#10;3:ج:2&#10;4:مقالي:3"></textarea>
                </div>
            </div>

            <!-- خيار الإدخال اليدوي للأسئلة -->
            <div id="manual-mode-container" class="hidden space-y-6">
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
                    <span class="font-bold text-gray-700">قائمة الأسئلة اليدوية:</span>
                    <button type="button" onclick="addManualQuestion()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition">
                        + إضافة سؤال جديد
                    </button>
                </div>

                <div id="manual-questions-list" class="space-y-4">
                    <!-- يتم توليد الأسئلة يدوياً هنا -->
                </div>
            </div>

            <button type="button" onclick="saveExamSettings()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-lg transition">
                حفظ وإصدار رابط الاختبار المخصص للطلاب 🔗
            </button>
        </form>
    </div>

    <script>
        function toggleInputMode() {
            const mode = document.getElementById('input-mode').value;
            if (mode === 'manual') {
                document.getElementById('pdf-mode-container').classList.add('hidden');
                document.getElementById('manual-mode-container').classList.remove('hidden');
                if(document.getElementById('manual-questions-list').children.length === 0) {
                    addManualQuestion();
                }
            } else {
                document.getElementById('pdf-mode-container').classList.remove('hidden');
                document.getElementById('manual-mode-container').classList.add('hidden');
            }
        }

        let qCount = 0;
        function addManualQuestion() {
            qCount++;
            const list = document.getElementById('manual-questions-list');
            const qHTML = `
                <div id="q-box-${qCount}" class="border p-4 rounded-xl bg-gray-50 relative space-y-3">
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="font-bold text-indigo-700">السؤال رقم (${qCount})</span>
                        <button type="button" onclick="document.getElementById('q-box-${qCount}').remove()" class="text-red-500 hover:text-red-700 text-xs font-bold">حذف السؤال ✕</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold mb-1">نص السؤال (يدعم الرياضيات MathJax مثل $\\frac{a}{b}$):</label>
                            <input type="text" class="w-full border p-2 rounded text-sm bg-white" placeholder="اكتب السؤال هنا...">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">نوع السؤال:</label>
                            <select class="w-full border p-2 rounded text-sm bg-white">
                                <option value="mcq">اختيار من متعدد</option>
                                <option value="tf">صح أو خطأ</option>
                                <option value="fill">إكمال الفراغ</option>
                                <option value="essay">سؤال مقالي</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                        <input type="text" class="border p-2 rounded bg-white" placeholder="الخيار (أ) / صحيح">
                        <input type="text" class="border p-2 rounded bg-white" placeholder="الخيار (ب) / خاطئ">
                        <input type="text" class="border p-2 rounded bg-white" placeholder="الخيار (ج)">
                        <input type="number" class="border p-2 rounded bg-white" placeholder="الدرجة" value="1">
                    </div>
                </div>
            `;
            list.insertAdjacentHTML('beforeend', qHTML);
        }

        function saveExamSettings() {
            alert('تم حفظ كافة إعدادات الاختبار ومفاتيح الإجابات بنجاح!\n\nيمكنك الآن إرسال رابط صفحة الاختبار (Exam.html) لطلابك.');
        }
    </script>
</body>
</html>
