<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم/ة | EduServices 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets-css-style.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-6">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <div class="mb-4">
            <a href="index.html" class="text-indigo-600 hover:underline text-sm font-semibold">← العودة للرئيسية</a>
        </div>
        <h2 class="text-2xl font-bold text-indigo-800 mb-4 border-b pb-2">لوحة تحكم المعلم/ة - إعداد الاختبار</h2>
        <p class="text-sm text-gray-600 mb-6">قم بتحديد إعدادات الاختبار ورفع نموذج الأسئلة والإجابات بكل سهولة.</p>

        <form id="exam-setup-form" class="space-y-6">
            <div>
                <label class="block font-semibold mb-2">عنوان الاختبار:</label>
                <input type="text" id="exam-title" class="w-full border p-3 rounded-lg" value="إختبار عن بعد مراقب بالذكاء الإصطناعي" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-semibold mb-2">عدد الأسئلة:</label>
                    <input type="number" id="questions-count" class="w-full border p-3 rounded-lg" min="1" value="5" required>
                </div>
                <div>
                    <label class="block font-semibold mb-2">طريقة إدخال الأسئلة:</label>
                    <select id="input-mode" class="w-full border p-3 rounded-lg">
                        <option value="pdf">رفع ملف الأسئلة (PDF / صورة) مع مفتاح الإجابة</option>
                        <option value="manual">إدخال الأسئلة يدوياً</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block font-semibold mb-2">رفع ملف الأسئلة (PDF أو صورة):</label>
                <input type="file" id="exam-file" class="w-full border p-2 rounded-lg bg-gray-50" accept=".pdf,image/*">
            </div>

            <div>
                <label class="block font-semibold mb-2">نموذج مفتاح الإجابات:</label>
                <textarea id="answer-key" rows="3" class="w-full border p-3 rounded-lg" placeholder="مثال: س1: A, س2: صح, س3: B"></textarea>
            </div>

            <button type="button" onclick="alert('تم حفظ إعدادات الاختبار بنجاح، ورابط الاختبار الخاص بك جاهز لمشاركته مع طلابك!')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
                إنشاء وتوليد رابط الاختبار الخاص بالطلاب
            </button>
        </form>
    </div>
</body>
</html>
